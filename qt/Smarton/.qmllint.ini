[General]
AdditionalImportPaths=
DisableDefaultImports=false
EnablePlugins=all

[Warnings]
# Unqualified access is the single largest cause of slow, unmaintainable QML:
# it forces a scope-chain lookup on every evaluation and defeats the compiler.
UnqualifiedAccess=error
DeprecatedProperty=error
MissingProperty=error
MissingType=error
IncompatibleType=error
PropertyAliasCycles=error
UnusedImports=warning
